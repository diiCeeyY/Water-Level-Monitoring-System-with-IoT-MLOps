name: wlm

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_PASS_INGEST: ${DB_PASS_INGEST:?Set DB_PASS_INGEST in .env}
      DB_PASS_GRAFANA: ${DB_PASS_GRAFANA:?Set DB_PASS_GRAFANA in .env}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/timescaledb/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    networks:
      - wlm-net

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    environment:
      MQTT_PASS_HEALTHCHECK: ${MQTT_PASS_HEALTHCHECK:?Set MQTT_PASS_HEALTHCHECK in .env}
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd
      - ./infra/mosquitto/aclfile:/mosquitto/config/aclfile
      - ./infra/mosquitto/conf.d:/mosquitto/config/conf.d
      - ./schemas/examples:/examples:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h 127.0.0.1 -p 1883 -u healthcheck
          -P "$${MQTT_PASS_HEALTHCHECK}" -t '$$SYS/broker/version' -C 1 -W 5
          >/dev/null 2>&1
      interval: 10s
      timeout: 7s
      retries: 5
      start_period: 5s
    mem_limit: 64m
    networks:
      - wlm-net

  nodered:
    build:
      context: ./infra/nodered
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_RED_CREDENTIAL_SECRET: ${NODERED_CREDENTIAL_SECRET:?Set NODERED_CREDENTIAL_SECRET in .env}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:?Set MQTT_TOPIC_PREFIX in .env}
      MQTT_TELEMETRY_TOPIC: ${MQTT_TOPIC_PREFIX:?Set MQTT_TOPIC_PREFIX in .env}/+/telemetry
      MQTT_STATUS_TOPIC: ${MQTT_TOPIC_PREFIX:?Set MQTT_TOPIC_PREFIX in .env}/+/status
      DB_USER_INGEST: wlm_ingest
      DB_PASS_INGEST: ${DB_PASS_INGEST:?Set DB_PASS_INGEST in .env}
    volumes:
      - nodered-data:/data
      - ./infra/nodered/settings.js:/data/settings.js:ro
    ports:
      - "127.0.0.1:1880:1880"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:1880',
          r => process.exit(r.statusCode < 500 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    networks:
      - wlm-net

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_PASS_GRAFANA: ${DB_PASS_GRAFANA:?Set DB_PASS_GRAFANA in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    mem_limit: 384m
    networks:
      - wlm-net

  loader:
    profiles:
      - tools
    image: wlm-tools:local
    build:
      context: .
      dockerfile: infra/tools/Dockerfile
    entrypoint:
      - python
      - -m
      - wlm.data.loader
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
      POSTGRES_USER: wlm_ingest
      POSTGRES_PASSWORD: ${DB_PASS_INGEST:?Set DB_PASS_INGEST in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - wlm-net

  replay:
    profiles:
      - tools
    image: wlm-tools:local
    build:
      context: .
      dockerfile: infra/tools/Dockerfile
    entrypoint:
      - python
      - -m
      - wlm.data.replay
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:?Set MQTT_TOPIC_PREFIX in .env}
      MQTT_USER_REPLAY: ${MQTT_USER_REPLAY:?Set MQTT_USER_REPLAY in .env}
      MQTT_PASS_REPLAY: ${MQTT_PASS_REPLAY:?Set MQTT_PASS_REPLAY in .env}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      nodered:
        condition: service_healthy
    networks:
      - wlm-net

networks:
  wlm-net:
    driver: bridge

volumes:
  pgdata:
  mosquitto-data:
  nodered-data:
  grafana-data:
