[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-level-mlops"
version = "0.1.0"
description = "IoT water-level monitoring and low-water prediction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "pyyaml",
    "pydantic>=2",
    "jsonschema>=4.21",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "paho-mqtt>=2",
    "tzdata",
]

[project.optional-dependencies]
ml = [
    "scikit-learn",
    "lightgbm",
]
api = [
    "scikit-learn",
    "lightgbm",
    "fastapi",
    "uvicorn[standard]",
    "mlflow-skinny",
]
jobs = [
    "scikit-learn",
    "lightgbm",
    "mlflow",
    "evidently==0.7.*",
    "apscheduler",
    "httpx",
    "matplotlib",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "dvc",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wlm*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
markers = [
    "integration: requires external services or infrastructure",
    "slow: takes longer than a typical unit test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
